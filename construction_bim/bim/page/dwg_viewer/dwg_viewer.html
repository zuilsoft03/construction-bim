<link rel="stylesheet" href="/assets/construction_bim/css/bim_viewer.css">
<div class="cad-viewer-container">
  <!-- Top Navigation & CAD Controls Toolbar -->
  <header class="cad-toolbar">
    <div class="toolbar-section left">
      <div class="app-brand">
        <span class="brand-icon">📐</span>
        <span class="brand-title">DWG CAD Viewer</span>
      </div>
      <div class="file-upload-wrapper">
        <label for="cad-file-input" class="btn btn-secondary btn-sm" title="Open DWG or DXF file">
          📂 Open CAD File
        </label>
        <input type="file" id="cad-file-input" accept=".dwg,.dxf" style="display:none;" />
      </div>
    </div>

    <!-- Navigation & Zoom Controls -->
    <div class="toolbar-section center">
      <div class="btn-group">
        <button id="btn-zoom-extents" class="btn btn-default btn-sm" title="Zoom Extents (Fit Drawing)">
          ⤢ Fit Extents
        </button>
        <button id="btn-zoom-in" class="btn btn-default btn-sm" title="Zoom In">🔍+</button>
        <button id="btn-zoom-out" class="btn btn-default btn-sm" title="Zoom Out">🔍−</button>
      </div>

      <div class="btn-group tool-selector">
        <button class="btn btn-default btn-sm active" data-cad-tool="pan" title="Pan / Navigate">✋ Pan</button>
        <button class="btn btn-default btn-sm" data-cad-tool="measure_dist" title="Measure Linear Distance">📏 Measure</button>
        <button class="btn btn-default btn-sm" data-cad-tool="measure_area" title="Measure Polygon Area">📐 Area</button>
        <button class="btn btn-default btn-sm pin-tool" data-cad-tool="pin" title="Drop BIMcollab Issue Pin">📍 Drop Issue Pin</button>
      </div>

      <!-- Theme Selector -->
      <div class="theme-selector-wrapper">
        <label for="select-cad-theme">Theme:</label>
        <select id="select-cad-theme" class="form-control input-sm">
          <option value="dark" selected>Classic Dark</option>
          <option value="black">Deep Black</option>
          <option value="paper">Paper White</option>
          <option value="blueprint">Blueprint Blue</option>
        </select>
      </div>
    </div>

    <!-- BCF Collaboration Controls -->
    <div class="toolbar-section right">
      <div class="bcf-actions">
        <button id="btn-export-bcf" class="btn btn-primary btn-sm" title="Export buildingSMART BCF 2.1 Package">
          📦 Export BCF (.bcfzip)
        </button>
        <label for="bcf-file-input" class="btn btn-default btn-sm" title="Import BCF Package">
          📥 Import BCF
        </label>
        <input type="file" id="bcf-file-input" accept=".bcfzip,.zip" style="display:none;" />
      </div>
    </div>
  </header>

  <!-- Main Workspace -->
  <div class="cad-main-workspace">
    <!-- CAD Canvas Viewport -->
    <div class="cad-canvas-viewport">
      <canvas id="cad-canvas"></canvas>

      <!-- Measurement Result Overlay -->
      <div id="cad-measure-result" class="cad-measure-result hidden"></div>
    </div>

    <!-- Right Side Collaboration & Layer Drawer -->
    <aside class="cad-sidebar">
      <div class="sidebar-tabs">
        <button class="tab-btn active" data-drawer-tab="issues">
          📌 BIMcollab Issues
        </button>
        <button class="tab-btn" data-drawer-tab="layers">
          📑 CAD Layers
        </button>
      </div>

      <!-- Panel: BIMcollab Issues -->
      <div id="panel-issues" class="drawer-panel">
        <div class="panel-header">
          <div class="filter-wrapper">
            <select id="filter-issue-status" class="form-control input-sm">
              <option value="All">All Statuses</option>
              <option value="Open">Open</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
              <option value="Closed">Closed</option>
            </select>
          </div>
        </div>
        <div id="bcf-issues-list" class="issues-list-container"></div>
      </div>

      <!-- Panel: CAD Layers -->
      <div id="panel-layers" class="drawer-panel hidden">
        <div class="panel-header">
          <h4>Drawing Layers</h4>
        </div>
        <div id="cad-layers-list" class="layers-list-container"></div>
      </div>
    </aside>

    <!-- Sliding Issue Detail Drawer -->
    <div id="issue-detail-drawer" class="issue-detail-drawer hidden"></div>
  </div>

  <!-- Footer Status Bar -->
  <footer class="cad-statusbar">
    <div id="cad-spaces-bar" class="cad-spaces-bar">
      <!-- Dynamic Layout tabs -->
    </div>
    <div id="cad-coord-hud" class="cad-coord-hud">
      X: 0.0 mm | Y: 0.0 mm | Zoom: 100%
    </div>
  </footer>

  <!-- Create Issue Modal -->
  <div id="create-issue-modal" class="modal-overlay hidden">
    <div class="modal-dialog">
      <div class="modal-header">
        <h3>Create BIMcollab Issue (BCF)</h3>
        <button class="btn-close" id="btn-cancel-create-issue">✕</button>
      </div>
      <form id="form-create-issue">
        <div class="modal-body">
          <div class="form-group">
            <label for="input-issue-title">Issue Title *</label>
            <input type="text" id="input-issue-title" class="form-control" required placeholder="e.g. Column clashes with Grid 4 Duct" />
          </div>
          <div class="form-row">
            <div class="form-group col-half">
              <label for="select-issue-type">Topic Type</label>
              <select id="select-issue-type" class="form-control">
                <option value="Issue">Issue</option>
                <option value="Clashing">Clashing</option>
                <option value="Request">Request</option>
                <option value="Remark">Remark</option>
                <option value="Inquiry">Inquiry</option>
                <option value="Coordination">Coordination</option>
              </select>
            </div>
            <div class="form-group col-half">
              <label for="select-issue-priority">Priority</label>
              <select id="select-issue-priority" class="form-control">
                <option value="Low">Low</option>
                <option value="Normal" selected>Normal</option>
                <option value="High">High</option>
                <option value="Critical">Critical</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="textarea-issue-desc">Description / Notes</label>
            <textarea id="textarea-issue-desc" class="form-control" rows="3" placeholder="Provide context, required dimension changes, or coordination details..."></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save Issue & Viewpoint</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="cad-toast" class="cad-toast"></div>
</div>
